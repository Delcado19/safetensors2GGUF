    "safetensors",
    "tqdm",
    "gradio>=6.14.0",
    "huggingface_hub",
    "transformers==4.57.6",
    "sentencepiece>=0.1.98,<0.3.0",
    "protobuf>=4.21.0,<5.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.15.13",
]

